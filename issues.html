<script>
const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"concern","name":"More concerned than excited about AI in daily life","y":78,"x":84,"summary":"52% of adults say the increased use of AI in daily life makes them more concerned than excited. 37% are equally both. 9% are more excited than concerned. Concern is up from 37% in 2021.","source":"Pew Research Center, June 22–28, 2026.","c":3},{"id":"regulate-trust","name":"Trust in the U.S. to regulate AI","y":64,"x":60,"summary":"In March 2025, 44% trusted the United States at least some to regulate AI use well, and 47% did not. Republicans were more trusting (54%) than Democrats (36%). The public has not handed the tool to a board.","source":"Pew Research Center, March 2025, reported November 6, 2025.","c":3},{"id":"where-helps","name":"Where people think AI helps","y":70,"x":48,"summary":"44% say AI will have a positive effect on medical care over 20 years, and 19% say negative. Only 24% expect a positive effect on education, and 23% on how people do their jobs. The tool is not one thing in the public mind.","source":"Pew Research Center, August 2024.","c":3}],"structural":[{"id":"no-blank-check","name":"Do not assume the public wants a regulator in charge","y":68,"x":48,"summary":"Trust in the U.S. government to regulate AI is split, 44% to 47%. A licensing regime is not a majority demand in this poll. It is also not a rejection. It is a fight.","source":"Pew Research Center, March 2025.","c":3}],"cultural":[{"id":"a1","name":"AI in daily life is more worrying than exciting","y":78,"x":22,"summary":"","source":"Pew Research Center, June 22–28, 2026: 52% more concerned than excited, 9% more excited than concerned. Democrats 56%, Republicans 49%.","c":3},{"id":"a2","name":"The tool is something to be excited about","y":24,"x":72,"summary":"","source":"Pew Research Center, June 2026: 9% are more excited than concerned. The aligned view is a small minority. It does not drive the debate.","c":3},{"id":"a3","name":"A public authority should be trusted to set the pace","y":60,"x":24,"summary":"","source":"Pew Research Center, March 2025: 44% trust the U.S. to regulate AI, 47% do not.","c":3},{"id":"a4","name":"Use the tool where it clearly helps, such as medicine","y":66,"x":70,"summary":"","source":"Pew Research Center, August 2024: 44% expect a positive effect on medical care, against 19% negative. Education and jobs do not get that benefit of the doubt.","c":3}]},{"id":"education","name":"Education","practical":[{"id":"would-use","name":"Parents who would use an education savings account","y":84,"x":72,"summary":"65% of school parents say they would enroll their child in an education savings account if they could. 13% say no. 22% are unsure. That is the demand number.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"esa-aware","name":"Support for an account before and after it is described","y":76,"x":48,"summary":"Without a description, 54% of Americans support education savings accounts. With a description, support rises to 78%, a 24-point jump. Parents move from 64% to 84%. People cannot use a tool they have not been shown.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"direction","name":"Parents who say K–12 is on the right track","y":28,"x":70,"summary":"41% of school parents say K–12 education is headed in the right direction. The number is cited constantly. It does not say whether a family can leave.","source":"EdChoice, 2025 Schooling in America Survey, March 28–April 7, 2025. 2,455 school parents.","c":3},{"id":"universal-pref","name":"Universal account versus a needs test","y":80,"x":66,"summary":"77% of Americans support an account for every student. 65% support one limited by income or special needs. Among account supporters in a separate poll, 70% want it universal.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3}],"structural":[{"id":"esa","name":"A universal education savings account","y":88,"x":74,"summary":"With a description, 78% of Americans and 84% of school parents support education savings accounts. 77% support making the account universal. A yes. every kid. foundation poll, asked differently, finds 63% support and 70% of those supporters want it for every family.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"tax-credit","name":"An education tax credit","y":82,"x":68,"summary":"72% of Americans and 82% of school parents support tax-credit scholarships. yes. every kid. foundation's November 2025 poll finds 58% support for education tax credits. Support is real. The size of it depends on the wording.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"open-enroll","name":"Any public school in the state, not the assigned one","y":64,"x":64,"summary":"64% support letting a student attend any public school in the state, regardless of address. A year earlier the same question was 68%, including 75% of K–12 parents.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025, and December 2024.","c":3},{"id":"charters","name":"Charter schools","y":46,"x":66,"summary":"68% of Americans and 75% of school parents support charter schools. Popular. Still a public school under a public rulebook, not the family holding the dollar.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"vouchers","name":"School vouchers","y":58,"x":66,"summary":"69% of Americans and 79% of school parents support vouchers. In 2025, Republican support was 77% and Democratic support was 57%. A voucher is one school slot. An account can buy more than a seat.","source":"EdChoice, 2026 Schooling in America Survey. EdChoice, 2025 Schooling in America, on the party split.","c":3},{"id":"needs","name":"Limit the account to low-income families","y":34,"x":62,"summary":"A needs test is less popular than a universal account: 65% versus 77% in the 2026 EdChoice survey, and 56% versus about three in four in 2025. Among account supporters, only 20% want it limited to low-income families.","source":"EdChoice, 2025 and 2026 Schooling in America Surveys. yes. every kid. foundation / YouGov, December 2024.","c":3}],"cultural":[{"id":"ed1","name":"A family should be able to customize a child's education","y":84,"x":86,"summary":"","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 72% say families should be able to customize K–12 to the child, a great deal or some.","c":3},{"id":"ed2","name":"Schools should be accountable to parents","y":78,"x":84,"summary":"","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 76% say K–12 schools need to be more accountable to parents.","c":3},{"id":"ed3","name":"Accountability is the right to leave with the money","y":80,"x":88,"summary":"","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 61% say schools are more accountable when a child can leave and take the funding.","c":3},{"id":"ed4","name":"The account should be for every family, not a means test","y":74,"x":82,"summary":"","source":"EdChoice, 2026 Schooling in America: 77% support a universal account, 65% a needs-based one. yes. every kid. foundation / YouGov, December 2024: 71% of account supporters want it universal, 20% want it limited to low-income families.","c":3},{"id":"ed5","name":"A child's address should assign the school","y":68,"x":18,"summary":"","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 64% support the opposite, access to any public school in the state. The assigned school is still the rule most children live under.","c":3},{"id":"ed6","name":"Only some families should be trusted with the dollar","y":36,"x":22,"summary":"","source":"EdChoice, 2025 Schooling in America: a universal account beats a needs-based one, about three in four versus 56%. The narrower value is the minority position.","c":3}]},{"id":"energy","name":"Energy","practical":[{"id":"bill","name":"The household energy bill","y":86,"x":90,"summary":"Three-quarters of adults say home energy costs have gone up, and 42% say they have gone up a lot. A separate voter survey finds 79% say household electricity costs rose over two years, and 83% are concerned. This is the number people already use.","source":"Pew Research Center, March 16–22, 2026. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"utility-margin","name":"How much of the bill is the utility's margin","y":78,"x":74,"summary":"Asked why the bill rose, 64% say a major reason is utility companies wanting to make more money. That is the explanation people reach for first.","source":"Pew Research Center, March 16–22, 2026, among adults who say home energy costs have risen.","c":3},{"id":"data-load","name":"Data centers' share of new electricity demand","y":74,"x":66,"summary":"43% say data centers using more energy are a major reason bills rose. In a separate survey, 58% say data centers are very or somewhat responsible for higher household electricity prices.","source":"Pew Research Center, March 16–22, 2026. Morning Consult, November 21–23, 2025.","c":3},{"id":"grid-cost","name":"Grid upgrade cost on the bill","y":70,"x":58,"summary":"40% say the cost of updating or expanding the grid is a major reason bills rose. Another 30% call it a minor reason. The line item is now part of the argument.","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"source-cost","name":"Whether wind and solar cost more than other power","y":68,"x":60,"summary":"Republicans are more likely to say wind (44%) and solar (43%) cost consumers more than other sources. Democrats are more likely to say each costs less (48%). The comparison itself is the live metric fight.","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"home-use","name":"Using more energy at home","y":24,"x":64,"summary":"Only 13% say using more energy at home is a major reason the bill rose. 46% say it is not a reason. People mention it. It does not explain the bill.","source":"Pew Research Center, March 16–22, 2026.","c":3}],"structural":[{"id":"deadlines","name":"Hard deadlines for issuing permits","y":82,"x":64,"summary":"Slide 3. Miss the date and the permit moves. 60% of likely 2026 voters support making energy infrastructure faster and easier to build, including 51% of Harris voters and 71% of Trump voters.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"nepa","name":"Reform state environmental review","y":76,"x":48,"summary":"Slide 3. A state NEPA process with an end, not an open-ended veto. Voters support faster energy permitting at 60%. That question is about speed, not a named repeal of a state environmental law.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":2},{"id":"discretion","name":"Reduce discretionary review","y":72,"x":46,"summary":"Slide 3. Objective standards instead of a hearing that can kill a project that already meets the rule. Same public support for speed, and no poll in this set asks about discretionary review by that name.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"rps","name":"Eliminate renewable portfolio standards","y":70,"x":40,"summary":"Slide 3. Repeal the rule that a share of power must come from a listed set of sources. No national poll in this set asks that question directly. The nearest fight, repealing renewable tax credits, is a split.","source":"Landscape deck, slide 3. Morning Consult, June 6–8, 2025, on tax credits, not portfolio standards.","c":2},{"id":"rofr","name":"End the right of first refusal","y":8,"x":80,"summary":"Slide 3 scores this 5–10% transformative and 80% popular. The utility gets the transmission contract without a bid. Useful, and it does not rewrite the system.","source":"Landscape deck, slide 3.","c":2},{"id":"nuclear-new","name":"Nuclear at new locations","y":80,"x":34,"summary":"Slide 3. 59% favor more nuclear plants, and 61% favor nuclear energy. 53% still oppose a plant in their area. A new site is the hard vote.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025. Gallup, March 2025 and March 2–18, 2026.","c":3},{"id":"nuclear-existing","name":"Expand and relicense nuclear at existing sites","y":74,"x":74,"summary":"Slide 3 separates this from new locations. 87% support renewing the license of a plant that still meets federal safety standards. 64% say build more plants.","source":"Landscape deck, slide 3. Bisconti Research, 2025 National Nuclear Energy Public Opinion Survey.","c":3},{"id":"smr","name":"A state category for small modular reactors","y":80,"x":36,"summary":"Slide 3. A new kind of nuclear, licensed at the state level, not a tweak to the old plant. 59% favor more nuclear. A new license class has not been polled on its own.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025, on more nuclear plants, not this license class.","c":2},{"id":"btm","name":"Behind-the-meter interconnection","y":68,"x":52,"summary":"Slide 3. A project on the customer's side of the meter should not wait in the big-generator queue. 60% want it to be easier to build energy infrastructure. That is the nearest number, not a behind-the-meter question.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"ppa","name":"Let a buyer sign their own power contract","y":58,"x":42,"summary":"Slide 3 lists power purchase agreements. A customer, a campus, or a town buys power directly instead of only through the utility. Not separately polled here.","source":"Landscape deck, slide 3.","c":1},{"id":"redundancy","name":"Let local redundancy through without a full utility case","y":64,"x":40,"summary":"Slide 3 calls this TorUS: rules for local redundancy, storage at the load, instead of waiting on a new line. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"sandbox","name":"A regulatory sandbox","y":48,"x":44,"summary":"Slide 3. A time-boxed waiver so a new model can run. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"threshold","name":"A minimum size before full regulation","y":60,"x":48,"summary":"Slide 3. Below a threshold, a project skips the full case. Above it, the ordinary rules apply. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"backyard","name":"A right to backyard solar","y":55,"x":62,"summary":"Slide 3. Panels on the property without a utility veto. 77% favor more solar power. That is support for the source, not a vote on a backyard ordinance.","source":"Landscape deck, slide 3. Pew Research Center, June 2025, on expanding solar power.","c":2}],"cultural":[{"id":"e1","name":"Keep consumer energy costs low","y":86,"x":90,"summary":"","source":"Pew Research Center, December 9, 2024: 59% say keeping consumer costs low is very important in climate policy. It is the top factor for Republicans, at 67%.","c":3},{"id":"e2","name":"Use every source so power stays affordable","y":82,"x":84,"summary":"","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026: 68% support an all-of-the-above mix, including wind, solar, natural gas, and nuclear. 44% had never heard the phrase.","c":3},{"id":"e3","name":"Build more nuclear power","y":74,"x":76,"summary":"","source":"Pew Research Center, April–May 2025: 59% favor more nuclear plants, up from 43% in 2020. Gallup, March 2025: 61% favor the use of nuclear energy.","c":3},{"id":"e4","name":"Prioritize wind and solar over oil, gas, and coal","y":76,"x":28,"summary":"","source":"Pew Research Center, March 16–22, 2026: 57% say prioritize renewables, down from 79% in 2020. Among Republicans the fossil ied with the cost of health care in the United States, the lowest Gallup has recorded since 2001. 57% are satisfied with the cost of their own care. Cost is the problem 29% name as the most urgent national health problem, the highest since 2004.","source":"West Health–Gallup, November 3–25, 2025.","c":3}],"structural":[{"id":"transparency","name":"Require prices to be posted","y":76,"x":68,"summary":"61% say boosting health care price-transparency rules should be a top priority for the administration and Congress. It was the top item in a list of proposals, and it had support in both parties.","source":"KFF Health Tracking Poll, published January 17, 2025.","c":3},{"id":"prior-auth","name":"Tighten the rules on insurance denials","y":58,"x":60,"summary":"55% say more closely regulating how insurers approve or deny care and drugs should be a top priority. Asked a different way, only 22% of insured adults pick eliminating prior authorization as their most important insurance change. The denial is a fight. The bill is the bigger one.","source":"KFF, January 2025, and KFF Health Tracking Poll, April 14–19, 2026.","c":3},{"id":"negotiate","name":"Expand Medicare negotiation of drug prices","y":44,"x":62,"summary":"55% say expanding the number of drugs subject to Medicare price negotiation should be a top priority. 28% say rolling that authority back should be. It is a popular price control, not a rule that adds clinicians or posts a cash price.","source":"KFF Health Tracking Poll, published January 17, 2025.","c":3}],"cultural":[{"id":"c1","name":"The point is affording the bill","y":86,"x":88,"summary":"","source":"KFF Health Tracking Poll, April 14–19, 2026: 64% worry about affording care. West Health–Gallup, November 2025: 16% are satisfied with the national cost.","c":3},{"id":"c2","name":"Know the price before you buy","y":72,"x":82,"summary":"","source":"KFF, January 2025: 61% say stronger price-transparency rules should be a top priority.","c":3},{"id":"c3","name"     const show = on || (matched && matchIds.size <= 4);
    const side = place.x > 58 ? "right:1.25rem" : "left:1.25rem";
    return '<button type="button" data-id="' + esc(p.id) + '" class="absolute flex -translate-x-1/2 translate-y-1/2 items-center" style="left:' + place.x + "%;bottom:" + place.y + "%;opacity:" + (dim ? ".25" : "1") + ";z-index:" + (on || matched ? 20 : 10) + '" aria-label="' + esc(p.name) + '"><span class="block h-3.5 w-3.5 rounded-full border-2" style="border-color:' + (on || matched ? "var(--ember)" : "var(--charcoal)") + ";background:" + (on ? "var(--ember)" : matched ? "rgba(196,92,38,.3)" : "#fff") + '"></span>' + (show ? '<span class="absolute top-1/2 max-w-52 -translate-y-1/2 rounded-md bg-white/95 px-1.5 py-0.5 text-xs leading-snug ' + (on ? "font-semibold" : "font-medium") + '" style="' + side + ";color:" + (on ? "var(--ember)" : "var(--charcoal)") + '">' + esc(p.name) + "</span>" : "") + "</button>";
  }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-24 shrink-0 flex-col text-right text-[11px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-80 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-24 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-3 text-[11px] font-medium sm:text-xs" style="color:var(--muted)"><span>' + esc(cfg.xl) + "</span><span>" + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  const level = item.c || 1;
  const bars = level === 3 ? 5 : level === 2 ? 3 : 1;
  const label = level === 3 ? "High" : level === 2 ? "Medium" : "Low";
  const note = level === 3
    ? "National opinion, in the aggregate. Not a forecast of a particular vote."
    : level === 2
      ? "Direction from conversations. Not a national count."
      : "A sketch. Not yet replaced by opinion research.";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p>" + (item.source ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">' + esc(item.source) + "</p>" : "") + "</div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= bars ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">' + label + '</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + note + '</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
</body>
</html>
