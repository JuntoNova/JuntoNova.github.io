const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"dollars-mw","name":"Dollars per megawatt","y":78,"x":40,"summary":"What power for compute costs. The resource number. The right to generate it is a law.","c":1},{"id":"queue-ai","name":"Days to interconnect a campus","y":76,"x":36,"summary":"How long a data center waits for power. The clock. The shot-clock statute is structural.","c":1},{"id":"watts-work","name":"Watts per unit of useful work","y":72,"x":30,"summary":"Energy per task the tool actually completes, not per token of trivia.","c":1},{"id":"water","name":"Water per megawatt-hour","y":48,"x":44,"summary":"Cooling water, posted. A resource constraint cities already feel.","c":1},{"id":"tool-use","name":"Share of the workday a tool is used","y":64,"x":28,"summary":"Whether people actually use it, not whether a lab demo worked.","c":1},{"id":"train-cost","name":"Cost of a standard training run","y":60,"x":34,"summary":"Dollars to train a known model. The price of entry, as a number.","c":1}],"structural":[{"id":"permit-dc","name":"Data-center permit shot-clock","y":58,"x":46,"summary":"A law: miss the deadline and the campus is deemed approved.","c":1},{"id":"behind-meter","name":"Behind-the-meter power allowed","y":74,"x":40,"summary":"A campus may generate and use its own power without joining the utility queue.","c":1},{"id":"sandbox-ai","name":"State AI regulatory sandbox","y":45,"x":55,"summary":"New products run under a published waiver while the statute catches up.","c":1},{"id":"open-weight","name":"Safe-harbor for open-weight models","y":60,"x":30,"summary":"Publishing a model is not a licensed activity. Liability stays on misuse, not on weights.","c":1},{"id":"chip-neutrality","name":"End industrial policy that picks chip winners","y":55,"x":15,"summary":"No subsidy stack that inflates costs for everyone not in the bill.","c":1},{"id":"license-lab","name":"Reject a federal lab-licensing regime","y":75,"x":25,"summary":"Training is not a utility franchise. No license that only incumbents can hold.","c":1},{"id":"utility-ai","name":"Keep AI off the utility model","y":65,"x":30,"summary":"Do not let the electric franchise become a compute franchise.","c":1},{"id":"liability","name":"Misuse liability, not pre-approval","y":50,"x":35,"summary":"Harm is punished after the fact. Shipping is not a federal permission.","c":1},{"id":"data","name":"Clear, cheap rules for training data","y":45,"x":22,"summary":"A statutory safe harbor for publicly available data, with an opt-out that is actually operable.","c":1}],"cultural":[{"id":"a1","name":"More intelligence should make ordinary life cheaper","y":84,"x":88,"summary":"","c":1},{"id":"a2","name":"Slow down until the risk is gone","y":72,"x":18,"summary":"","c":1},{"id":"a3","name":"Be open to tools we do not fully control","y":66,"x":74,"summary":"","c":1},{"id":"a4","name":"Only licensed experts should build","y":60,"x":16,"summary":"","c":1},{"id":"a5","name":"AI should benefit everyone equally","y":18,"x":22,"summary":"","c":1},{"id":"a6","name":"Faster tools are a good","y":70,"x":80,"summary":"","c":1},{"id":"a7","name":"Human judgment should stay in charge","y":28,"x":62,"summary":"","c":1},{"id":"a8","name":"Don't ship what you cannot fully explain","y":40,"x":24,"summary":"","c":1}]},{"id":"education","name":"Education","practical":[{"id":"spend-pupil","name":"Spending per pupil","y":36,"x":84,"summary":"Fully loaded dollars per student, posted every year. The number is everywhere. It does not, by itself, produce a reader.","c":1},{"id":"ratio","name":"Students per teacher","y":34,"x":78,"summary":"The ratio districts already track. Smaller classes are a resource choice, not a law and not a belief.","c":1},{"id":"naep","name":"NAEP scores","y":86,"x":70,"summary":"The national score for what students can actually do in reading and math. Used often. It is the performance number.","c":1},{"id":"pisa","name":"PISA scores","y":80,"x":32,"summary":"The international comparison. High signal. American districts almost never manage to it.","c":1},{"id":"classroom-share","name":"Share of dollars in the classroom","y":74,"x":26,"summary":"Of every dollar spent, how many reach instruction. Rarely published cleanly. When it is, it changes the argument.","c":1},{"id":"minutes","name":"Minutes of instruction","y":58,"x":48,"summary":"Actual teaching time in a year, not the length of the calendar. A standard you can count.","c":1}],"structural":[{"id":"read-by-three","name":"Read by three","y":76,"x":46,"summary":"A law: identify struggling readers early, use a proven method, and hold the line at third grade.","c":1},{"id":"tenure","name":"Teacher tenure","y":68,"x":16,"summary":"End or sharply limit tenure so a classroom can be restaffed when the results are bad.","c":1},{"id":"esa","name":"Education savings accounts","y":82,"x":38,"summary":"A portable account for every child. The family buys the seat, the tutor, or the tool.","c":1},{"id":"charters","name":"Charter schools","y":64,"x":50,"summary":"Lift the cap and the local veto. A charter is a different set of rules, not a different metric.","c":1},{"id":"follow","name":"Funding follows the child","y":80,"x":24,"summary":"The dollar is attached to the student, not the zip code. Assignment by geography ends.","c":1},{"id":"cert","name":"Open the classroom to proven talent","y":48,"x":28,"summary":"A statute that lets a subject expert teach without the traditional certificate.","c":1},{"id":"open-enroll","name":"Open enrollment","y":52,"x":36,"summary":"A family may leave the assigned district. The receiving school cannot refuse for reasons of residence.","c":1}],"cultural":[{"id":"ed1","name":"A child should leave third grade able to read","y":86,"x":90,"summary":"","c":1},{"id":"ed2","name":"Be willing to try a new school model","y":74,"x":78,"summary":"","c":1},{"id":"ed3","name":"Stick with what already performs","y":68,"x":70,"summary":"","c":1},{"id":"ed4","name":"The point of school is what a student can do","y":80,"x":84,"summary":"","c":1},{"id":"ed5","name":"Don't experiment on children","y":60,"x":22,"summary":"","c":1},{"id":"ed6","name":"The point is a shared experience, not a score","y":34,"x":24,"summary":"","c":1},{"id":"ed7","name":"We support teachers","y":16,"x":74,"summary":"","c":1},{"id":"ed8","name":"Every child deserves the best","y":14,"x":80,"summary":"","c":1}]},{"id":"energy","name":"Energy","practical":[{"id":"kwh","name":"All-in cents per kilowatt-hour","y":78,"x":90,"summary":"The household price. About nine in ten say it has gone up, and most say the last bill was higher than usual. Making the power is the largest piece. Then local wires. Then long-distance lines.","c":3},{"id":"queue-days","name":"Interconnection queue, in days","y":78,"x":40,"summary":"How long a new watt waits to connect. The number. The law that forces a decision sits on the structural map.","c":1},{"id":"reserve","name":"Reserve margin","y":82,"x":62,"summary":"Spare capacity versus peak demand. The standard for whether the lights stay on.","c":1},{"id":"saidi","name":"Outage minutes per customer","y":74,"x":58,"summary":"How long the average household is dark in a year. Utilities already collect it.","c":1},{"id":"new-mw","name":"Cost of a new megawatt","y":80,"x":34,"summary":"What it costs to add supply, by plant type. Rarely shown next to the rate case.","c":1},{"id":"bill-share","name":"Energy bill as a share of income","y":36,"x":48,"summary":"People talk about the bill, not their income share. The bill is the number they feel.","c":2}],"structural":[{"id":"shot-clock","name":"Interconnection shot-clock","y":76,"x":58,"summary":"Miss the deadline and the connection is deemed approved. A national majority wants it to be easier to build every kind of supply. A clock is how that becomes a rule.","c":3},{"id":"smr","name":"New licensing category for small nuclear","y":80,"x":34,"summary":"A new license class. More people want today's nuclear rules kept or tightened than want them eased. Openness is cautious, and it falls when the frame is an old accident. A long campaign.","c":3},{"id":"territory","name":"Eliminate service territories","y":80,"x":18,"summary":"End the exclusive franchise. People already inclined to freer markets like the idea of making power and selling it. Most others are wary of leaving the utility. Not a near-term vote.","c":2},{"id":"ror","name":"End guaranteed rate of return","y":50,"x":5,"summary":"Stop paying a regulated return on capital whether or not the plant was needed.","c":1},{"id":"rofr","name":"Eliminate right of first refusal","y":10,"x":25,"summary":"The incumbent may not take a transmission project without a bid.","c":1},{"id":"private-grids","name":"Private grids","y":70,"x":34,"summary":"A campus or a town may own its own wires. Same split as selling your own power: welcome on one side, rejected on the other.","c":2},{"id":"ercot","name":"State grid supremacy (ERCOT)","y":50,"x":10,"summary":"Keep the bulk of a state's grid inside state jurisdiction rather than FERC interstate markets.","c":1},{"id":"bans","name":"Eliminate bans on energy production","y":74,"x":56,"summary":"Repeal the rules that forbid a fuel, a well, or a line. A national majority wants it to be easier to produce every kind of energy. People who want freer markets are nearly unanimous. The other side is not.","c":3},{"id":"subsidies","name":"Eliminate all energy subsidies","y":72,"x":40,"summary":"Stop paying one fuel to beat another. People who want freer markets want every subsidy ended. Others oppose a subsidy when it looks like a handout, and support one when it looks green. A bridge in conversation, not a national majority.","c":2},{"id":"sandbox","name":"Regulatory sandbox","y":48,"x":30,"summary":"A time-boxed waiver so a new model can run. Welcome among people who already want fewer rules. Rejected by people who want more of them.","c":2},{"id":"unbundle","name":"Unbundle generation from wires","y":72,"x":22,"summary":"Where a monopoly remains, it is wires-only. Generation competes.","c":1},{"id":"used-useful","name":"Used-and-useful rate base","y":70,"x":18,"summary":"A rule: a return is allowed only on plant that is used and useful. A purpose statement is not a statute.","c":1},{"id":"local-veto","name":"No local veto of a project that meets the standard","y":78,"x":68,"summary":"A town may add conditions. It may not kill a project that already meets the state standard. A clear national majority agrees, by a wider margin than almost any other energy rule.","c":3},{"id":"mandates","name":"Repeal product and efficiency mandates","y":58,"x":66,"summary":"No bans and no efficiency quotas on the car, the furnace, or the appliance. A national majority wants the household to choose. Stronger outside the big metros, and overwhelming among people who already want freer markets. A near-term vote with a visible receipt.","c":3}],"cultural":[{"id":"e1","name":"The goal is human flourishing","y":88,"x":86,"summary":"","c":2},{"id":"e2","name":"The goal is eliminating carbon emissions","y":78,"x":16,"summary":"","c":3},{"id":"e3","name":"Be open to nuclear, gas, and new supply","y":80,"x":82,"summary":"","c":3},{"id":"e4","name":"Stick with plants people already know","y":22,"x":30,"summary":"","c":1},{"id":"e5","name":"Protect wildlife even if power costs more","y":18,"x":14,"summary":"","c":1},{"id":"e6","name":"Cheap, reliable power is the point","y":86,"x":90,"summary":"","c":3},{"id":"e7","name":"Using less energy is the virtue","y":28,"x":18,"summary":"","c":2},{"id":"e8","name":"Don't take risks with new supply","y":64,"x":24,"summary":"","c":2}]},{"id":"healthcare","name":"Healthcare","practical":[{"id":"price-metric","name":"Posted price of a common procedure","y":68,"x":34,"summary":"The cash price of a scan, a birth, a stitch. The number. The law that requires it is structural.","c":1},{"id":"wait-days","name":"Days to an appointment","y":74,"x":55,"summary":"How long a new patient waits. Clinics already know it. Households usually do not.","c":1},{"id":"outcomes","name":"Complication and readmission rates","y":80,"x":48,"summary":"Whether the care worked. The performance number, separate from the bill.","c":1},{"id":"admin-share","name":"Administrative share of the premium","y":62,"x":28,"summary":"Of every premium dollar, how many never reach a clinician.","c":1},{"id":"oop","name":"Out-of-pocket dollars per household","y":44,"x":72,"summary":"What a family actually pays. Cited often. It hides the total price.","c":1},{"id":"generic-share","name":"Generic share of prescriptions","y":58,"x":64,"summary":"How often the cheaper equivalent is what gets filled. A standard you can count.","c":1}],"structural":[{"id":"prior-auth","name":"Prior-authorization shot-clock","y":48,"x":44,"summary":"A law: a set number of hours to approve or deny. Silence is approval.","c":1},{"id":"price","name":"Real price transparency with cash default","y":45,"x":50,"summary":"Every shoppable service has a posted cash price that is the real price.","c":1},{"id":"con","name":"Repeal certificate of need","y":55,"x":30,"summary":"A new clinic, MRI, or maternity ward does not need permission from its competitor.","c":1},{"id":"site","name":"Site-neutral payments","y":50,"x":35,"summary":"The same procedure pays the same in a hospital outpatient department or a clinic.","c":1},{"id":"pbm","name":"PBM spread-pricing ban and pass-through","y":40,"x":45,"summary":"Middlemen cannot keep a spread between what they charge the plan and pay the pharmacy.","c":1},{"id":"scope","name":"Full practice for qualified clinicians","y":40,"x":40,"summary":"Nurse practitioners, pharmacists, and specialists practice at the top of their training.","c":1},{"id":"interstate","name":"Interstate license compact, automatic","y":50,"x":38,"summary":"A clean license in one state is a clean license in all.","c":1},{"id":"third-par   }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-24 shrink-0 flex-col text-right text-[11px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-80 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-24 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-3 text-[11px] font-medium sm:text-xs" style="color:var(--muted)"><span>' + esc(cfg.xl) + "</span><span>" + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  const level = item.c || 1;
  const bars = level === 3 ? 5 : level === 2 ? 3 : 1;
  const label = level === 3 ? "High" : level === 2 ? "Medium" : "Low";
  const note = level === 3
    ? "National opinion, in the aggregate. Not a forecast of a particular vote."
    : level === 2
      ? "Direction from conversations. Not a national count."
      : "A sketch. Not yet replaced by opinion research.";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p></div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= bars ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">' + label + '</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + note + '</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
</body>
</html>
