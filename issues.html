ax what is spent, not what is built. Work and saving cease to be the target."},{"id":"credits-out","name":"Convert the code from a spending bill to a tax bill","y":70,"x":10,"summary":"Social policy leaves the 1040 and becomes an on-budget program, or ends."},{"id":"gross-receipts","name":"Repeal gross-receipts and turnover taxes","y":45,"x":30,"summary":"Stop taxing revenue before profit, which stacks into prices."},{"id":"state-comp","name":"Protect state tax competition","y":40,"x":35,"summary":"No federal cap that punishes states for having a low-rate model."},{"id":"local-auth","name":"Require a vote for new local authorities","y":35,"x":40,"summary":"Special districts, TIF, and authorities cannot levy without the people who pay."},{"id":"ss-honest","name":"Honest accounting of payroll entitlements","y":65,"x":12,"summary":"Treat Social Security and Medicare cashflows as the household liabilities they are."},{"id":"stepup","name":"Keep basis step-up; kill double tax on death","y":25,"x":35,"summary":"A family business or house is not a second taxable event at the funeral."}],"cultural":[{"id":"x1","name":"A household should keep more of what it earns","y":90,"x":84,"summary":""},{"id":"x2","name":"Work, saving, and building should not be punished","y":82,"x":74,"summary":""},{"id":"x3","name":"The bill should be simple enough to understand","y":52,"x":70,"summary":""},{"id":"x4","name":"States should be allowed to compete on tax","y":58,"x":46,"summary":""},{"id":"x5","name":"The code should correct unfairness even if it is complex","y":22,"x":48,"summary":""},{"id":"x6","name":"High earners exist primarily to fund the rest","y":20,"x":36,"summary":""},{"id":"x7","name":"National uniformity beats fifty experiments","y":18,"x":30,"summary":""},{"id":"x8","name":"If the goal is good, the rate can be hidden","y":12,"x":22,"summary":""}]},{"id":"transportation","name":"Transportation","practical":[{"id":"insurance","name":"Usage-based insurance as default option","y":30,"x":55,"summary":"Pay for the miles and the risk you actually take."},{"id":"parking-t","name":"Priced curb, published occupancy","y":35,"x":42,"summary":"The curb is a number: occupancy, price, turnover, on a dashboard."},{"id":"nea","name":"NEPA clocks on highway and rail repairs","y":45,"x":28,"summary":"Days of review for work on existing rights-of-way is a published cap."},{"id":"trip-time","name":"Published corridor trip times","y":20,"x":60,"summary":"Peak minutes on the routes people actually use, updated on a clock."},{"id":"fuel-metric","name":"Cost-per-mile, posted by fuel and mode","y":25,"x":50,"summary":"A household can see the all-in cost of a mile: fuel, insurance, fare, delay."}],"structural":[{"id":"fuel","name":"Repeal fuel-type mandates","y":50,"x":25,"summary":"No EV quota, no fuel ban. The cheapest reliable mile wins."},{"id":"occupancy","name":"Right-size occupancy and taxi rules","y":40,"x":40,"summary":"Vans, jitneys, and independent drivers may serve thin routes without a medallion."},{"id":"autonomy","name":"Statewide AV sandbox","y":65,"x":30,"summary":"A single state rule set so autonomous fleets can run without a city-by-city veto."},{"id":"transit-monopoly","name":"End exclusive transit franchises","y":70,"x":15,"summary":"Cities may run a service; they may not forbid competitors on the same corridor."},{"id":"user-pays","name":"User-pays roads with surplus rebated","y":60,"x":18,"summary":"Roads are paid by users. Surplus goes back to households, not into an expanding program."},{"id":"faa","name":"Open low-altitude and small-air markets","y":55,"x":20,"summary":"Air taxis, cargo drones, and small fields get a permission structure measured in months."},{"id":"labor-t","name":"Repeal transit work-rules that pad headcount","y":50,"x":10,"summary":"Operators staff to the schedule, not to a 1970s run-cut."}],"cultural":[{"id":"t1","name":"Time stuck in transit is money taken from a family","y":86,"x":82,"summary":""},{"id":"t2","name":"A car is a tool of freedom, not a moral failing","y":78,"x":70,"summary":""},{"id":"t3","name":"New operators should be easy to try on a public street","y":56,"x":44,"summary":""},{"id":"t4","name":"Energy for movement should be abundant and cheap","y":80,"x":62,"summary":""},{"id":"t5","name":"Driving should be discouraged for the climate","y":16,"x":50,"summary":""},{"id":"t6","name":"Mode share is a goal the city should enforce","y":18,"x":30,"summary":""},{"id":"t7","name":"The street belongs to the plan, not the trip you need today","y":14,"x":26,"summary":""},{"id":"t8","name":"Precaution about new vehicles outranks getting there","y":20,"x":34,"summary":""}]}]};
const LENSES = [
  { id: "practical", label: "Practical", caption: "Metrics, materials, and standards.", color: "#F97316" },
  { id: "structural", label: "Structural", caption: "Rules, incentives, and power.", color: "#DC2626" },
  { id: "cultural", label: "Cultural", caption: "Goals, beliefs, and values.", color: "#7F1D1D" },
];
const MATRIX = {
  practical: {
    yh: "High performing", yl: "Low performing", xl: "Not useful", xh: "Used often", xp: "Used often", yp: "Performance",
    quads: [
      ["Find a use", "Performs. Rarely used.", "top-3 left-3 text-left"],
      ["Double down", "Performs. Used often.", "top-3 right-3 text-right"],
      ["Avoid", "Low performance. Not useful.", "bottom-3 left-3 text-left"],
      ["Spend little", "Useful. Doesn't perform.", "bottom-3 right-3 text-right"],
    ],
  },
  structural: {
    yh: "High impact", yl: "Little impact", xl: "Hard to pass", xh: "Likely to pass", xp: "Likely to pass", yp: "Cost & quality",
    quads: [
      ["Long-term campaigns", "Hard to pass, high impact", "top-3 left-3 text-left"],
      ["Focus here", "Likely to pass, high impact", "top-3 right-3 text-right"],
      ["Ignore these", "Hard to pass, little impact", "bottom-3 left-3 text-left"],
      ["Short-term campaigns", "Likely to pass, little impact", "bottom-3 right-3 text-right"],
    ],
  },
  cultural: {
    yh: "Drives change", yl: "Doesn't drive change", xl: "Not yet held", xh: "Already held", xp: "Already held", yp: "Drives change",
    quads: [
      ["Shift", "Drives change. Not yet held.", "top-3 left-3 text-left"],
      ["Mobilize", "Drives change. Already held.", "top-3 right-3 text-right"],
      ["Noise", "Doesn't move the bill.", "bottom-3 left-3 text-left"],
      ["Cheap talk", "Held until the price shows up.", "bottom-3 right-3 text-right"],
    ],
  },
};
function theory(item, lens) {
  if (lens !== "cultural") return item.summary;
  const drives = item.y >= 50, held = item.x >= 50;
  if (drives && held) return "Already held. This is not a persuasion problem. Mobilize the people who already believe this into bills, take-up, and votes.";
  if (drives && !held) return "This would drive real change if more people held it. The work is shifting opinion, not turnout.";
  if (!drives && held) return "Held until the price shows up. People will say they want this until the bill arrives — then they don't. Cheap talk, not leverage.";
  return "Neither widely held nor a driver of the bill. Interesting. Not leverage.";
}
function fold(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function areaBy(id) { return DATA.areas.find((a) => a.id === id) || DATA.areas[0]; }
function items(area, lens) { return area[lens]; }
function spread(list) {
  const pts = list.map((p) => ({ id: p.id, x: p.x, y: p.y }));
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = 0; j < i; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy) || 0.2;
        if (d >= 8) continue;
        const push = (8 - d) / 2;
        pts[i].x += (dx / d) * push; pts[i].y += (dy / d) * push;
        pts[j].x -= (dx / d) * push; pts[j].y -= (dy / d) * push;
      }
    }
  }
  const out = {};
  pts.forEach((p) => { out[p.id] = { x: Math.min(97, Math.max(3, p.x)), y: Math.min(97, Math.max(3, p.y)) }; });
  return out;
}
const params = new URLSearchParams(location.search);
let areaId = DATA.areas.some((a) => a.id === params.get("area")) ? params.get("area") : "energy";
let lens = LENSES.some((l) => l.id === params.get("lens")) ? params.get("lens") : "practical";
let selected = null;
let query = "";
let openHits = false;
let activeHit = 0;

const areaEl = document.getElementById("area");
const lensesEl = document.getElementById("lenses");
const qEl = document.getElementById("q");
const hitsEl = document.getElementById("hits");
const clearEl = document.getElementById("clear");

DATA.areas.forEach((a) => {
  const o = document.createElement("option");
  o.value = a.id; o.textContent = a.name;
  areaEl.appendChild(o);
});
LENSES.forEach((l) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.lens = l.id;
  b.textContent = l.label;
  b.className = "rounded-full border px-4 py-2 text-sm font-medium";
  b.onclick = () => { lens = l.id; selected = null; sync(); };
  lensesEl.appendChild(b);
});
areaEl.onchange = () => { areaId = areaEl.value; selected = null; sync(); };
qEl.oninput = () => { query = qEl.value; openHits = true; activeHit = 0; renderHits(); paintMatrix(); };
qEl.onfocus = () => { openHits = true; renderHits(); };
qEl.onkeydown = (e) => {
  const hits = search();
  if (e.key === "ArrowDown") { e.preventDefault(); openHits = true; activeHit = Math.min(activeHit + 1, Math.max(hits.length - 1, 0)); renderHits(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); activeHit = Math.max(activeHit - 1, 0); renderHits(); }
  else if (e.key === "Enter" && openHits && hits[activeHit]) { e.preventDefault(); pick(hits[activeHit]); }
  else if (e.key === "Escape") { openHits = false; renderHits(); }
};
clearEl.onclick = () => { query = ""; qEl.value = ""; openHits = false; renderHits(); paintMatrix(); };
document.addEventListener("mousedown", (e) => {
  if (!qEl.parentElement.contains(e.target)) { openHits = false; renderHits(); }
  if (!document.getElementById("menu-toggle").parentElement.contains(e.target)) closeMenu();
});

function catalog() {
  const rows = [];
  DATA.areas.forEach((a) => LENSES.forEach((l) => items(a, l.id).forEach((p) => rows.push({ area: a, lens: l.id, item: p }))));
  return rows;
}
const CATALOG = catalog();
function search() {
  const tokens = fold(query).split(" ").filter(Boolean);
  if (!tokens.length) return [];
  return CATALOG.map((row) => {
    const name = fold(row.item.name);
    const hay = name + " " + fold(row.item.summary) + " " + fold(row.area.name);
    if (!tokens.every((t) => hay.includes(t))) return null;
    let score = 0;
    const joined = tokens.join(" ");
    if (name.includes(joined)) score += 80;
    if (name.startsWith(joined)) score += 40;
    if (row.area.id === areaId) score += 25;
    if (row.lens === lens) score += 10;
    return { row, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.row.item.name.localeCompare(b.row.item.name)).slice(0, 8).map((r) => r.row);
}
function pick(row) {
  areaId = row.area.id;
  lens = row.lens;
  selected = row.item.id;
  query = row.item.name;
  qEl.value = query;
  openHits = false;
  sync();
}
function renderHits() {
  const hits = search();
  clearEl.classList.toggle("hidden", !query);
  clearEl.classList.toggle("flex", !!query);
  if (!openHits || !fold(query)) { hitsEl.classList.add("hidden"); hitsEl.innerHTML = ""; return; }
  hitsEl.classList.remove("hidden");
  if (!hits.length) { hitsEl.innerHTML = '<li class="px-3 py-2.5 text-sm" style="color:var(--muted)">Nothing matches.</li>'; return; }
  hitsEl.innerHTML = hits.map((row, i) => {
    const label = LENSES.find((l) => l.id === row.lens).label + (row.area.id !== areaId ? " · " + row.area.name : "");
    return '<li><button type="button" data-i="' + i + '" class="flex w-full flex-col items-start gap-0.5 px-3 py-2.5 text-left ' + (i === activeHit ? "bg-slate-50" : "") + '"><span class="text-sm font-medium">' + esc(row.item.name) + '</span><span class="text-[11px] tracking-wide" style="color:var(--muted)">' + esc(label) + "</span></button></li>";
  }).join("");
  hitsEl.querySelectorAll("button").forEach((b) => {
    b.onmouseenter = () => { activeHit = Number(b.dataset.i); };
    b.onclick = () => pick(hits[Number(b.dataset.i)]);
  });
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => c === "&" ? "\u0026amp;" : c === "<" ? "\u0026lt;" : c === ">" ? "\u0026gt;" : "\u0026quot;");
}
function sync() {
  const url = new URL(location.href);
  url.searchParams.set("area", areaId);
  url.searchParams.set("lens", lens);
  history.replaceState(null, "", url);
  areaEl.value = areaId;
  document.querySelectorAll("#lenses button").forEach((b) => {
    const on = b.dataset.lens === lens;
    b.style.background = on ? "#1A1A1A" : "#fff";
    b.style.color = on ? "#fff" : "#64748B";
    b.style.borderColor = on ? "#1A1A1A" : "#E2E8F0";
  });
  const bar = document.getElementById("bar");
  bar.innerHTML = LENSES.map((l) => '<div class="h-full flex-1" style="background:' + l.color + (l.id === lens ? "" : "40") + '"></div>').join("");
  document.getElementById("caption").textContent = LENSES.find((l) => l.id === lens).caption;
  const list = items(areaBy(areaId), lens);
  if (!selected || !list.some((p) => p.id === selected)) selected = list[0] ? list[0].id : null;
  renderHits();
  paintMatrix();
  paintDetail();
}
function paintMatrix() {
  const area = areaBy(areaId);
  const list = items(area, lens);
  const cfg = MATRIX[lens];
  const pos = spread(list);
  const tokens = fold(query);
  const matchIds = tokens ? new Set(search().filter((r) => r.area.id === areaId && r.lens === lens).map((r) => r.item.id)) : null;
  const quads = cfg.quads.map((q) => '<div class="pointer-events-none absolute z-0 max-w-36 ' + q[2] + '"><div class="text-xs font-semibold" style="color:rgba(26,26,26,.55)">' + esc(q[0]) + '</div><div class="text-[11px] leading-snug" style="color:var(--muted)">' + esc(q[1]) + "</div></div>").join("");
  const dots = list.map((p) => {
    const place = pos[p.id];
    const on = p.id === selected;
    const matched = matchIds ? matchIds.has(p.id) : false;
    const dim = matchIds && matchIds.size > 0 && !matched && !on;
    const show = on || (matched && matchIds.size <= 4);
    const side = place.x > 58 ? "right:1.25rem" : "left:1.25rem";
    return '<button type="button" data-id="' + esc(p.id) + '" class="absolute flex -translate-x-1/2 translate-y-1/2 items-center" style="left:' + place.x + "%;bottom:" + place.y + "%;opacity:" + (dim ? ".25" : "1") + ";z-index:" + (on || matched ? 20 : 10) + '" aria-label="' + esc(p.name) + '"><span class="block h-3.5 w-3.5 rounded-full border-2" style="border-color:' + (on || matched ? "var(--ember)" : "var(--charcoal)") + ";background:" + (on ? "var(--ember)" : matched ? "rgba(196,92,38,.3)" : "#fff") + '"></span>' + (show ? '<span class="absolute top-1/2 max-w-52 -translate-y-1/2 rounded-md bg-white/95 px-1.5 py-0.5 text-xs leading-snug ' + (on ? "font-semibold" : "font-medium") + '" style="' + side + ";color:" + (on ? "var(--ember)" : "var(--charcoal)") + '">' + esc(p.name) + "</span>" : "") + "</button>";
  }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-24 shrink-0 flex-col text-right text-[11px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-80 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-24 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-3 text-[11px] font-medium sm:text-xs" style="color:var(--muted)"><span>' + esc(cfg.xl) + "</span><span>" + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p></div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= 1 ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">Low</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">Assumption. Not market data. The coordinates are a sketch until they are replaced by polling, take-up, and price series.</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
