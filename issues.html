<script>
const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"task-price","name":"Price of a finished task","y":86,"x":74,"summary":"What a household or a firm pays to get one job done with the tool. The cost number people already feel.","source":"","c":1},{"id":"hours-saved","name":"Hours saved on a standard task","y":82,"x":68,"summary":"Time returned on work people already do: a draft, a schedule, a spreadsheet. Used, and it performs.","source":"","c":1},{"id":"error-rate","name":"Error rate on a defined task","y":76,"x":36,"summary":"How often the tool is wrong on a job you can specify. High signal. Most buyers still don't see it.","source":"","c":1},{"id":"run-cost","name":"Monthly cost to run a capable model","y":70,"x":32,"summary":"The price of using a strong model for a month, not the price of a power plant.","source":"","c":1},{"id":"weekly-use","name":"Share of workers who use a tool in a normal week","y":40,"x":78,"summary":"Adoption. Cited constantly. It does not say whether the task got cheaper or more accurate.","source":"","c":1},{"id":"ship-time","name":"Days from idea to a shipped feature","y":64,"x":44,"summary":"How fast a small team can put a tool in a product. A clock. Not yet a number the public uses.","source":"","c":1}],"structural":[{"id":"no-license","name":"No license required to ship a model","y":84,"x":34,"summary":"Training and release are not a franchise. A license only the largest labs can hold is a barrier.","source":"","c":1},{"id":"one-rule","name":"One national rule, not fifty state AI codes","y":80,"x":46,"summary":"A patchwork of state permissions is a tax on every small builder. One clear rule, or none.","source":"","c":1},{"id":"liability","name":"Liability for harm, not permission to ship","y":74,"x":38,"summary":"Punish misuse and injury. Do not make shipping a federal pre-approval.","source":"","c":1},{"id":"open-weight","name":"Safe harbor for open-weight models","y":72,"x":28,"summary":"Publishing weights is not a licensed activity. Smaller firms compete by shipping the tool, not by owning a permit.","source":"","c":1},{"id":"compute-cap","name":"No compute cap only the largest labs can clear","y":70,"x":30,"summary":"A threshold that bans training past a size hands the market to whoever is already big.","source":"","c":1},{"id":"train-data","name":"Clear rules for publicly available training data","y":64,"x":26,"summary":"A statutory path for public data, and an opt-out a person can actually use. Fog is a moat for the best-lawyered lab.","source":"","c":1},{"id":"profession","name":"No new license to use a tool in a licensed job","y":66,"x":32,"summary":"A doctor, a teacher, or an accountant may use the tool. The profession does not grow a second permit.","source":"","c":1}],"cultural":[{"id":"a1","name":"Tools should make ordinary work cheaper","y":86,"x":88,"summary":"","source":"","c":1},{"id":"a2","name":"People may use a tool without asking a board","y":80,"x":82,"summary":"","source":"","c":1},{"id":"a3","name":"Builders should be allowed to ship","y":74,"x":78,"summary":"","source":"","c":1},{"id":"a4","name":"Open tools beat a licensed few","y":68,"x":74,"summary":"","source":"","c":1},{"id":"a5","name":"Slow down until every risk is gone","y":76,"x":14,"summary":"","source":"","c":1},{"id":"a6","name":"Only licensed labs should train","y":64,"x":16,"summary":"","source":"","c":1},{"id":"a7","name":"A public body should set the pace","y":66,"x":18,"summary":"","source":"","c":1},{"id":"a8","name":"Equal outcomes matter more than a lower price","y":30,"x":20,"summary":"","source":"","c":1}]},{"id":"education","name":"Education","practical":[{"id":"family-price","name":"Price of a year of learning a family can buy","y":84,"x":76,"summary":"Tuition, a microschool, a tutor. Families already shop this number. It is the cost that matters.","source":"","c":1},{"id":"options-near","name":"Options a family can actually buy","y":80,"x":34,"summary":"How many lawful providers are in reach, not how many district programs exist on paper. High signal. Rarely published.","source":"","c":1},{"id":"dollars-family","name":"Dollars the family directs","y":88,"x":30,"summary":"Of the public dollars attached to a child, how many the parent can spend. The resource number. Most states still don't post it.","source":"","c":1},{"id":"strings","name":"Rules on each dollar a family spends","y":72,"x":28,"summary":"How many approvals sit between the family and a purchase. A regulation count, not a test score.","source":"","c":1},{"id":"naep","name":"NAEP scores","y":28,"x":74,"summary":"A state average. Cited constantly. It does not tell a family whether they can leave, or what a year costs.","source":"","c":1},{"id":"spend-pupil","name":"District spending per pupil","y":32,"x":86,"summary":"The district's fully loaded number. Everywhere. It is not the price the family pays and it is not an exit.","source":"","c":1}],"structural":[{"id":"tax-credit","name":"A tax credit with few strings","y":90,"x":58,"summary":"The family gets their own money back and buys the education. The state does not approve each purchase.","source":"","c":1},{"id":"esa","name":"A universal education savings account","y":86,"x":64,"summary":"Every child, not a means test. The account can buy a school, a tutor, or a microschool.","source":"","c":1},{"id":"light-rules","name":"No state list of approved purchases","y":84,"x":34,"summary":"Once the family has the dollar, they spend it. A regulator does not sit in the middle of every receipt.","source":"","c":1},{"id":"open-supply","name":"Let new schools open without a license maze","y":78,"x":36,"summary":"Cut the certificate, zoning, and cap that keep a teacher from starting a school.","source":"","c":1},{"id":"charters","name":"More charter seats","y":42,"x":60,"summary":"One more public option, still inside a public rulebook. Useful. Not the same as the family holding the dollar.","source":"","c":1},{"id":"read-by-three","name":"Read by three","y":26,"x":66,"summary":"A mandate on the school: a curriculum and a retention line. It does not give the family an exit.","source":"","c":1},{"id":"tenure","name":"End teacher tenure","y":18,"x":20,"summary":"A personnel fight inside the district. It does not change who decides for the child.","source":"","c":1}],"cultural":[{"id":"ed1","name":"The family, not the district, should decide","y":88,"x":86,"summary":"","source":"","c":1},{"id":"ed2","name":"The dollar belongs with the family","y":84,"x":82,"summary":"","source":"","c":1},{"id":"ed3","name":"New ways of learning should be easy to start","y":74,"x":78,"summary":"","source":"","c":1},{"id":"ed4","name":"Education should work like the rest of life: you choose","y":80,"x":84,"summary":"","source":"","c":1},{"id":"ed5","name":"Experts should set the program","y":70,"x":16,"summary":"","source":"","c":1},{"id":"ed6","name":"A common school is the civic glue","y":66,"x":22,"summary":"","source":"","c":1},{"id":"ed7","name":"A test score is the point of school","y":32,"x":18,"summary":"","source":"","c":1},{"id":"ed8","name":"Don't let families try something unapproved","y":62,"x":20,"summary":"","source":"","c":1}]},{"id":"energy","name":"Energy","practical":[{"id":"bill","name":"The household energy bill","y":86,"x":90,"summary":"Three-quarters of adults say home energy costs have gone up, and 42% say they have gone up a lot. A separate voter survey finds 79% say household electricity costs rose over two years, and 83% are concerned. This is the number people already use.","source":"Pew Research Center, March 16–22, 2026. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"utility-margin","name":"How much of the bill is the utility's margin","y":78,"x":74,"summary":"Asked why the bill rose, 64% say a major reason is utility companies wanting to make more money. That is the explanation people reach for first.","source":"Pew Research Center, March 16–22, 2026, among adults who say home energy costs have risen.","c":3},{"id":"data-load","name":"Data centers' share of new electricity demand","y":74,"x":66,"summary":"43% say data centers using more energy are a major reason bills rose. In a separate survey, 58% say data centers are very or somewhat responsible for higher household electricity prices.","source":"Pew Research Center, March 16–22, 2026. Morning Consult, November 21–23, 2025.","c":3},{"id":"grid-cost","name":"Grid upgrade cost on the bill","y":70,"x":58,"summary":"40% say the cost of updating or expanding the grid is a major reason bills rose. Another 30% call it a minor reason. The line item is now part of the argument.","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"source-cost","name":"Whether wind and solar cost more than other power","y":68,"x":60,"summary":"Republicans are more likely to say wind (44%) and solar (43%) cost consumers more than other sources. Democrats are more likely to say each costs less (48%). The comparison itself is the live metric fight.","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"home-use","name":"Using more energy at home","y":24,"x":64,"summary":"Only 13% say using more energy at home is a major reason the bill rose. 46% say it is not a reason. People mention it. It does not explain the bill.","source":"Pew Research Center, March 16–22, 2026.","c":3}],"structural":[{"id":"permit","name":"Make energy permitting faster","y":84,"x":64,"summary":"60% of likely 2026 voters support a plan to make building energy infrastructure faster and easier, including 51% of Harris voters, 63% of swing voters, and 71% of Trump voters. Affordability is the argument that wins.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026, about 20,000 likely 2026 voters.","c":3},{"id":"certainty","name":"A cleared project cannot be cancelled by the president","y":70,"x":66,"summary":"By 62% to 21%, voters say the president should not be able to cancel an energy project that has already cleared review. Half of Trump voters agree.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"all-sources","name":"No ban on a source that can be built","y":80,"x":70,"summary":"68% support using every source, including wind, solar, natural gas, and nuclear, so electricity stays affordable and reliable. Support is 68% among Harris voters and 71% among Trump voters.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"ev-rule","name":"Repeal the rule that EVs are half of new sales by 2032","y":62,"x":64,"summary":"58% oppose rules that would make electric vehicles at least half of new cars and trucks sold by 2032. Republican opposition is 83%. Among Democrats, 64% support the rules and 35% oppose them.","source":"Pew Research Center, May 13–19, 2024.","c":3},{"id":"nuclear-build","name":"License and build more nuclear plants","y":82,"x":42,"summary":"59% favor more nuclear plants to generate electricity, up from 43% in 2020. Gallup finds 61% favor nuclear energy. The same public still resists a plant nearby: 53% oppose one in their area. National support is not a local permit.","source":"Pew Research Center, April–May 2025. Gallup, March 3–16, 2025, and March 2–18, 2026.","c":3},{"id":"offshore","name":"More offshore oil and gas drilling","y":48,"x":40,"summary":"The country is split: 50% favor more offshore drilling and 46% oppose it. Fracking is also split, 45% favor and 48% oppose. Opening the Arctic refuge is not close: 35% favor and 61% oppose.","source":"Gallup, March 3–16, 2025.","c":3},{"id":"credits","name":"Repeal tax credits for renewable production and EV purchases","y":36,"x":44,"summary":"Voters are evenly divided. Opposition to stripping those credits rose to 42% by June 2025. A home efficiency credit, asked separately, still draws 83% support. Ending subsidies is not a public majority.","source":"Morning Consult, June 6–8, 2025. Pew Research Center, December 2024, on the home efficiency credit.","c":3},{"id":"local-block","name":"A town may block a data center","y":30,"x":62,"summary":"55% oppose a data center in their community and 24% support one. Morning Consult finds 41% support banning AI data-center construction near where they live. The public will pass a block. A block does not lower the bill.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026. Morning Consult, November 21–23, 2025.","c":3}],"cultural":[{"id":"e1","name":"Keep consumer energy costs low","y":86,"x":90,"summary":"","source":"Pew Research Center, December 9, 2024: 59% say keeping consumer costs low is very important in climate policy. It is the top factor for Republicans, at 67%.","c":3},{"id":"e2","name":"Use every source so power stays affordable","y":82,"x":84,"summary":"","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026: 68% support an all-of-the-above mix, including wind, solar, natural gas, and nuclear. 44% had never heard the phrase.","c":3},{"id":"e3","name":"Build more nuclear power","y":74,"x":76,"summary":"","source":"Pew Research Center, April–May 2025: 59% favor more nuclear plants, up from 43% in 2020. Gallup, March 2025: 61% favor the use of nuclear energy.","c":3},{"id":"e4","name":"Prioritize wind and solar over oil, gas, and coal","y":76,"x":28,"summary":"","source":"Pew Research Center, March 16–22, 2026: 57% say prioritize renewables, down from 79% in 2020. Among Republicans the fossil-fuel priority is now 71%, up from the reverse in 2020.","c":3},{"id":"e5","name":"The goal is carbon neutrality by 2050","y":70,"x":22,"summary":"","source":"Pew Research Center, May 13–19, 2024: 63% support the U.S. taking steps to become carbon neutral by 2050. Fewer call getting to net zero very important than call keeping costs low very important.","c":3},{"id":"e6","name":"Not near me, even if the country says it wants the plant","y":68,"x":16,"summary":"","source":"Gallup, March 2–18, 2026: 53% oppose a nuclear plant in their area, even as national support for more emphasis on nuclear is the highest Gallup has measured, at 46%.","c":3},{"id":"e7","name":"Limiting my own carbon footprint is a duty","y":22,"x":20,"summary":"","source":"Pew Research Center, May 13–19, 2024: 25% say it is extremely or very important to them personally to limit their own carbon footprint.","c":3},{"id":"e8","name":"The government should encourage wind and solar","y":64,"x":34,"summary":"","source":"Pew Research Center, March 16–22, 2026: 65% say the federal government should encourage wind and solar production, down from 72% in 2022.","c":3}]},{"id":"healthcare","name":"Healthcare","practical":[{"id":"price-metric","name":"Posted price of a common procedure","y":68,"x":34,"summary":"The cash price of a scan, a birth, a stitch. The number. The law that requires it is structural.","source":"","c":1},{"id":"wait-days","name":"Days to an appointment","y":74,"x":55,"summary":"How long a new patient waits. Clinics already know it. Households usually do not.","source":"","c":1},{"id":"outcomes","name":"Complication and readmission rates","y":80,"x":48,"summary":"Whether the care worked. The performance number, separate from the bill.","source":"","c":1},{"id":"admin-share","name":"Administrative share of the premium","y":62,"x":28,"summary":"Of every premium dollar, how many never reach a clinician.","source":"","c":1},{"id":"oop","name":"Out-of-pocket dollars per household","y":44,"x":72,"summary":"What a family actually pays. Cited often. It hides the total price.","source":"","c":1},{"id":"generic-share","name":"Generic share of prescriptions","y":58,"x":64,"summary":"How often the cheaper equivalent is what gets filled. A standard you can count.","source":"","c":1}],"structural":[{"id":"prior-auth","name":"Prior-authorization shot-clock","y":48,"x":44,"summary":"A law: a set number of hours to approve or deny. Silence is approval.","source":"","c":1},{"id":"price","name":"Real price   const tokens = fold(query);
  const matchIds = tokens ? new Set(search().filter((r) => r.area.id === areaId && r.lens === lens).map((r) => r.item.id)) : null;
  const quads = cfg.quads.map((q) => '<div class="pointer-events-none absolute z-0 max-w-36 ' + q[2] + '"><div class="text-xs font-semibold" style="color:rgba(26,26,26,.55)">' + esc(q[0]) + '</div><div class="text-[11px] leading-snug" style="color:var(--muted)">' + esc(q[1]) + "</div></div>").join("");
  const dots = list.map((p) => {
    const place = pos[p.id];
    const on = p.id === selected;
    const matched = matchIds ? matchIds.has(p.id) : false;
    const dim = matchIds && matchIds.size > 0 && !matched && !on;
    const show = on || (matched && matchIds.size <= 4);
    const side = place.x > 58 ? "right:1.25rem" : "left:1.25rem";
    return '<button type="button" data-id="' + esc(p.id) + '" class="absolute flex -translate-x-1/2 translate-y-1/2 items-center" style="left:' + place.x + "%;bottom:" + place.y + "%;opacity:" + (dim ? ".25" : "1") + ";z-index:" + (on || matched ? 20 : 10) + '" aria-label="' + esc(p.name) + '"><span class="block h-3.5 w-3.5 rounded-full border-2" style="border-color:' + (on || matched ? "var(--ember)" : "var(--charcoal)") + ";background:" + (on ? "var(--ember)" : matched ? "rgba(196,92,38,.3)" : "#fff") + '"></span>' + (show ? '<span class="absolute top-1/2 max-w-52 -translate-y-1/2 rounded-md bg-white/95 px-1.5 py-0.5 text-xs leading-snug ' + (on ? "font-semibold" : "font-medium") + '" style="' + side + ";color:" + (on ? "var(--ember)" : "var(--charcoal)") + '">' + esc(p.name) + "</span>" : "") + "</button>";
  }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-24 shrink-0 flex-col text-right text-[11px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-80 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-24 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-3 text-[11px] font-medium sm:text-xs" style="color:var(--muted)"><span>' + esc(cfg.xl) + "</span><span>" + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  const level = item.c || 1;
  const bars = level === 3 ? 5 : level === 2 ? 3 : 1;
  const label = level === 3 ? "High" : level === 2 ? "Medium" : "Low";
  const note = level === 3
    ? "National opinion, in the aggregate. Not a forecast of a particular vote."
    : level === 2
      ? "Direction from conversations. Not a national count."
      : "A sketch. Not yet replaced by opinion research.";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p>" + (item.source ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">' + esc(item.source) + "</p>" : "") + "</div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= bars ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">' + label + '</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + note + '</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
</body>
</html>
